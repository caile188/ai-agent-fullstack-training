# 离线决策脚本 · 业务样例：回答"登录会话有效期"这类运维问答。
# 这一类的正确干法是——先查带引用的知识库（rag_query），再据检索结果作答，
# 而不是凭模型记忆编一个数字。用 --decider mock --script 指到本文件即可离线逐字重跑。
steps:
  - text: "这是有权威出处的事实问题，先查 RAG 知识库，拿带引用的检索结果。"
    tool_calls:
      - name: rag_query
        args:
          question: "登录会话的有效期是多少分钟？到期边界怎么处理？"
          mode: hybrid
          top_k: 3

  - text: "依据知识库（编号对应 rag_query 返回的来源追溯）：登录会话有效期 30 分钟，从签发时刻计时、到期即无效、空闲不自动续期 [1]；支付会话 5 分钟、超时置 PAY_TIMEOUT 需重新下单 [2]；会话矩阵另给出匿名浏览 120 分钟、记住我令牌 30 天 [3]。结论：登录会话是 30 分钟，恰好到期视为无效这条边界以 session-rules.md 为准。"
