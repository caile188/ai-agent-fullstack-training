[project]
name = "governed-llm-gateway"
version = "0.1.0"
description = "Governed multi-provider LLM Gateway: capability routing, prompt contracts, resilience, observability"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "anthropic>=0.49,<1.0",
    "openai>=1.50",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "aiosqlite>=0.20",
    "PyYAML>=6.0",
    "jsonschema>=4.23",
    "Jinja2>=3.1",
    "tiktoken>=0.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "anyio>=4.4"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
